[project]
name = "coffee-apps"
version = "0.1.0"
description = "コーヒー豆 在庫管理アプリ"
requires-python = ">=3.13"
dependencies = [
    "django>=6.1,<6.2",
    "psycopg[binary]>=3.2",
    "dj-database-url>=3.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-django>=4.11",
    "ruff>=0.13",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
addopts = "--reuse-db"

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "DJ"]
