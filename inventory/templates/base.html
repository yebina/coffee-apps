<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}焙煎豆の在庫{% endblock %}</title>
</head>
<body>
  {% if user.is_authenticated %}
  <header>
    <form method="post" action="{% url 'logout' %}">{% csrf_token %}<button>ログアウト</button></form>
  </header>
  {% endif %}
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
