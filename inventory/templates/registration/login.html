{% extends "base.html" %}{% load static %}
{% block title %}ログイン・{% endblock %}
{% block body %}
<main class="login">
  <div class="brand">{% include "inventory/partials/icon.html" with name="bean" size=28 %}<span class="brand-name">豆帳</span></div>
  <form class="form-section" method="post">
    {% csrf_token %}
    <h1 class="panel-title">ログイン</h1>
    {% if form.errors %}<div class="alert alert-error" role="alert">ユーザー名かパスワードが違います。</div>{% endif %}
    <div class="field"><label class="field-label" for="id_username">ユーザー名</label><input class="input" id="id_username" name="username" autocomplete="username" autocapitalize="none" value="{{ form.username.value|default:'' }}" required autofocus></div>
    <div class="field"><label class="field-label" for="id_password">パスワード</label><input class="input" id="id_password" name="password" type="password" autocomplete="current-password" required></div>
    <input type="hidden" name="next" value="{{ next }}">
    <button class="btn btn-primary btn-block">ログイン</button>
  </form>
</main>
{% endblock %}
