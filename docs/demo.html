  /* ---------- 銘柄・商品 ---------- */
  function CoffeeCard({ ctx, coffee }) {
    const { d, nav, commit, notify } = ctx;
    const [adding, setAdding] = useState(false);
    const [pf, setPf] = useState({ sizeG: '', price: '', packCost: '' });
    const [err, setErr] = useState('');
    const rem = d.coffeeRemain(coffee.id);
    const products = d.productsOf(coffee.id);
    const stockRoasts = d.roastsOf(coffee.id).filter(r => d.roastRemain(r) > 0);
    const latest = d.latestRoastOf(coffee.id);
    const setP = k => e => { const v = e.target.value; setPf(p => ({ ...p, [k]: v })); };
    const addProduct = () => {
      const size = parseNum(pf.sizeG), price = parseNum(pf.price), pack = isBlank(pf.packCost) ? 0 : parseNum(pf.packCost);
      if (!(Number.isInteger(size) && size > 0)) { setErr('内容量を g の整数で入力してください。'); return; }
      if (!(Number.isFinite(price) && price >= 0)) { setErr('販売価格（税抜）を円で入力してください。'); return; }
      if (!(Number.isFinite(pack) && pack >= 0)) { setErr('包材費は 0 以上の数字で入力してください。'); return; }
      commit(n => { n.products.push({ id: uid('p'), coffeeId: coffee.id, sizeG: size, price, packCost: pack, active: true }); });
      setPf({ sizeG: '', price: '', packCost: '' }); setErr(''); setAdding(false);
      notify(`${coffee.name} に ${size}g の商品を追加しました`);
    };
    const toggleCoffee = () => commit(n => { const c = n.coffees.find(x => x.id === coffee.id); c.active = !c.active; });
    const toggleProduct = pid => commit(n => { const p = n.products.find(x => x.id === pid); p.active = !p.active; });
    return html`<section className="panel">
      <div className="coffee-head">
        <div className="row-main">
          <div className="row-title"><h2 className="panel-title">${coffee.name}</h2><${LevelChip} level=${latest ? latest.level : ''} />${coffee.active ? null : html`<span className="chip chip-off">販売停止</span>`}</div>
          <div className="row-meta">${stockRoasts.length ? `いちばん古い焙煎から ${daysBetween(stockRoasts[0].at.slice(0, 10), TODAY)}日` : '在庫なし'}${coffee.description ? `・${coffee.description}` : ''}</div>
        </div>
        <div className="row-side"><div className="big">${fmtG(rem)}</div><div className="row-sub">焙煎豆の残量</div></div>
      </div>
      <div className="table-wrap"><table className="data">
        <thead><tr><th>内容量</th><th className="r">販売価格（税抜）</th><th className="r">包材費</th><th className="r">何個分</th><th>販売</th></tr></thead>
        <tbody>${products.length === 0 ? html`<tr><td colSpan="5" className="muted">商品（内容量と価格）がまだありません。</td></tr>` : products.map(p => html`<tr key=${p.id}>
          <td className="nw">${p.sizeG} g</td><td className="r">${yen(p.price)}</td><td className="r">${yen(p.packCost || 0)}</td><td className="r">${Math.floor(Math.max(0, rem) / p.sizeG)} 個</td>
          <td><label className="switch"><input id=${`product-active-${p.id}`} type="checkbox" checked=${p.active} onChange=${() => toggleProduct(p.id)} /><span>${p.active ? '販売中' : '停止中'}</span></label></td>
        </tr>`)}</tbody>
      </table></div>
      ${adding ? html`<div className="product-form">
        <div className="grid grid-3">
          <${Field} label="内容量" req htmlFor=${`pf-size-${coffee.id}`}><${UnitInput} unit="g" inputMode="numeric" id=${`pf-size-${coffee.id}`} value=${pf.sizeG} onChange=${setP('sizeG')} /></${Field}>
          <${Field} label="販売価格（税抜）" req htmlFor=${`pf-price-${coffee.id}`}><${UnitInput} unit="円" inputMode="numeric" id=${`pf-price-${coffee.id}`} value=${pf.price} onChange=${setP('price')} /></${Field}>
          <${Field} label="包材費" htmlFor=${`pf-pack-${coffee.id}`} hint="1個あたりの袋・ラベル代"><${UnitInput} unit="円" inputMode="numeric" id=${`pf-pack-${coffee.id}`} value=${pf.packCost} onChange=${setP('packCost')} /></${Field}>
        </div>
        ${err ? html`<div className="field-error" role="alert">${err}</div>` : null}
        <div><button type="button" className="btn btn-primary btn-small" onClick=${addProduct}>商品を追加する</button></div>
      </div>` : null}
      ${stockRoasts.length ? html`<details className="roast-stock">
        <summary>焙煎記録ごとの残量（${stockRoasts.length}件）</summary>
        <p className="panel-note">販売すると、焙煎日の古い行から順に減ります。</p>
        <div className="table-wrap"><table className="data compact">
          <thead><tr><th>焙煎日</th><th>生豆ロット</th><th className="r">焙煎後</th><th className="r">残量</th><th className="r">1g あたり原価</th></tr></thead>
          <tbody>${stockRoasts.map(r => { const l = d.lots.get(r.lotId); return html`<tr key=${r.id} className="is-link" onClick=${() => nav('roast', { id: r.id })}>
            <td className="nw"><button type="button" className="cell-link" onClick=${e => { e.stopPropagation(); nav('roast', { id: r.id }); }}>${fmtDate(r.at.slice(0, 10))}</button></td>
            <td>${l ? l.name : '—'}</td><td className="r">${fmtG(r.outputG)}</td><td className="r">${fmtG(d.roastRemain(r))}</td><td className="r">${perG(d.roastGCost(r))}</td>
          </tr>`; })}</tbody>
        </table></div>
      </details>` : null}
      <div className="card-foot">
        <button type="button" className="btn btn-small" onClick=${() => setAdding(!adding)}>${adding ? '追加をやめる' : '商品を追加'}</button>
        <button type="button" className="btn btn-quiet btn-small" onClick=${toggleCoffee}>${coffee.active ? '販売をやめる' : '販売を再開する'}</button>
      </div>
    </section>`;
  }

  function CoffeeList({ ctx }) {
    const { db, commit, notify } = ctx;
    const [showAll, setShowAll] = useState(false);
    const [name, setName] = useState('');
    const [err, setErr] = useState('');
    const coffees = db.coffees.filter(c => showAll || c.active);
    const addCoffee = () => {
      const v = name.trim();
      if (!v) { setErr('銘柄名を入力してください。'); return; }
      commit(n => { n.coffees.push({ id: uid('c'), name: v, description: '', active: true }); });
      setName(''); setErr('');
      notify(`銘柄「${v}」を追加しました。商品（内容量と価格）も追加してください`);
    };
    return html`
      <${PageHead} title="銘柄・商品" eyebrow="在庫" />
      <p className="lead">銘柄は販売する焙煎豆の種類、商品は銘柄×内容量です。在庫は銘柄ごとに g で数え、どの内容量で売っても同じ在庫から減ります。</p>
      <div className="toolbar">
        <${Seg} label="表示する銘柄" value=${showAll ? 'all' : 'active'} onChange=${v => setShowAll(v === 'all')} options=${[['active', '販売中'], ['all', 'すべて']]} />
        <div className="inline-add search">
          <label className="sr-only" htmlFor="coffee-new-name">新しい銘柄名</label>
          <input id="coffee-new-name" className="input" placeholder="新しい銘柄名" value=${name} onChange=${e => setName(e.target.value)} />
          <button type="button" className="btn" onClick=${addCoffee}>銘柄を追加</button>
        </div>
      </div>
      ${err ? html`<div className="field-error" role="alert">${err}</div>` : null}
      ${coffees.map(c => html`<${CoffeeCard} key=${c.id} ctx=${ctx} coffee=${c} />`)}`;
  }

  /* ---------- 販売 ---------- */
  function SaleList({ ctx }) {
    const { db, d, nav } = ctx;
    const months = [...new Set(db.sales.map(s => s.date.slice(0, 7)))].sort().reverse();
    const thisYm = TODAY.slice(0, 7);
    const [month, setMonth] = useState(months.includes(thisYm) ? thisYm : 'all');
    const sales = db.sales.filter(s => month === 'all' || s.date.slice(0, 7) === month).sort((a, b) => b.date.localeCompare(a.date) || b.id.localeCompare(a.id));
    const amount = sum(sales, d.saleAmount), cost = sum(sales, d.saleCost);
    return html`
      <${PageHead} title="販売" eyebrow="記録する"><button type="button" className="btn btn-primary" onClick=${() => nav('saleForm')}>販売を記録</button></${PageHead}>
      <div className="toolbar">
        <label className="sr-only" htmlFor="sale-month">表示する月</label>
        <select id="sale-month" className="select select-auto" value=${month} onChange=${e => setMonth(e.target.value)}>
          <option value="all">すべての月</option>
          ${months.map(m => html`<option key=${m} value=${m}>${monthLabel(m)}</option>`)}
        </select>
        <span className="muted small">${sales.length}件・売上 ${yen(amount)}・粗利 ${yen(amount - cost)}（税抜）</span>
      </div>
      <div className="panel">
        ${sales.length === 0 ? html`<p className="empty">この月の販売はありません。</p>` : html`<ul className="rows">${sales.map(s => {
          const a = d.saleAmount(s), c = d.saleCost(s);
          const first = s.items[0];
          const summary = first ? `${d.productLabel(d.products.get(first.productId))}×${first.qty}${s.items.length > 1 ? ` ほか${s.items.length - 1}件` : ''}` : '';
          return html`<li key=${s.id}><button type="button" className="row" onClick=${() => nav('sale', { id: s.id })}>
            <div className="row-main">
              <div className="row-title"><span>${fmtDate(s.date)}</span><span className="chip">${s.channel}</span>${s.customer ? html`<span className="row-meta">${s.customer}</span>` : null}</div>
              <div className="row-meta">${summary}</div>
            </div>
            <div className="row-side"><div className="row-num">${yen(a)}</div><div className="row-sub">粗利 ${yen(a - c)}（${pct((a - c) / a)}）</div></div>
          </button></li>`;
        })}</ul>`}
      </div>`;
  }

  function SaleDetail({ ctx, params }) {
    const { db, d, nav, commit, notify } = ctx;
    const sale = db.sales.find(s => s.id === params.id);
    if (!sale) return html`<${NotFound} ctx=${ctx} to="sales" label="販売" />`;
    const amount = d.saleAmount(sale), cost = d.saleCost(sale), margin = amount - cost;
    const remove = () => { commit(n => { n.sales = n.sales.filter(x => x.id !== sale.id); }); notify('販売を削除して、在庫を戻しました'); nav('sales'); };
    return html`
      <${PageHead} back=${{ label: '販売', go: () => nav('sales') }} eyebrow=${[sale.channel, sale.customer].filter(Boolean).join('・')} title=${`${fmtDate(sale.date)} の販売`}>
        <button type="button" className="btn" onClick=${() => nav('saleForm', { id: sale.id })}>編集</button>
        <${ConfirmButton} label="削除" confirmLabel="もう一度押すと削除します" onConfirm=${remove} />
      </${PageHead}>
      <div className="stats">
        <${Stat} label="金額（税抜）" value=${yen(amount)} />
        <${Stat} label="原価" value=${yen(cost)} />
        <${Stat} label="粗利" value=${yen(margin)} />
        <${Stat} label="粗利率" value=${pct(margin / amount)} />
      </div>
      <section className="panel">
        <div className="panel-head"><h2 className="panel-title">明細</h2><span className="muted small">税抜</span></div>
        <div className="table-wrap"><table className="data">
          <thead><tr><th>商品</th><th className="r">数量</th><th className="r">単価</th><th className="r">金額</th><th className="r">原価</th><th className="r">粗利</th></tr></thead>
          <tbody>${sale.items.map(it => { const a = d.itemAmount(it), c = d.itemCost(it); return html`<tr key=${it.id}>
            <td>${d.productLabel(d.products.get(it.productId))}</td><td className="r">${it.qty}</td><td className="r">${yen(it.unitPrice)}</td><td className="r">${yen(a)}</td><td className="r">${yen(c)}</td><td className="r">${yen(a - c)}</td>
          </tr>`; })}</tbody>
          <tfoot><tr><td>合計</td><td className="r">${sum(sale.items, it => it.qty)}</td><td></td><td className="r">${yen(amount)}</td><td className="r">${yen(cost)}</td><td className="r">${yen(margin)}</td></tr></tfoot>
        </table></div>
      </section>
      <section className="panel">
        <div className="panel-head"><h2 className="panel-title">引当（どの焙煎の豆を出したか）</h2></div>
        <p className="panel-note">焙煎日の古い順に在庫から出しています。明細の原価 ＝ 重さ × その焙煎の 1g あたり原価 ＋ 包材費 × 数量。</p>
        <div className="table-wrap"><table className="data">
          <thead><tr><th>商品</th><th>焙煎記録</th><th className="r">重さ</th><th className="r">1g あたり原価</th><th className="r">豆の原価</th></tr></thead>
          <tbody>${sale.items.flatMap(it => it.allocs.map((al, i) => {
            const r = d.roasts.get(al.roastId);
            const l = r ? d.lots.get(r.lotId) : null;
            return html`<tr key=${`${it.id}-${i}`} className="is-link" onClick=${() => r && nav('roast', { id: r.id })}>
              <td>${d.productLabel(d.products.get(it.productId))}×${it.qty}</td>
              <td><button type="button" className="cell-link" onClick=${e => { e.stopPropagation(); if (r) nav('roast', { id: r.id }); }}>${r ? `${fmtDate(r.at.slice(0, 10))} 焙煎` : '—'}</button><div className="row-meta">${l ? l.name : ''}</div></td>
              <td className="r">${fmtG(al.g)}</td><td className="r">${r ? perG(d.roastGCost(r)) : '—'}</td><td className="r">${yen(d.allocCost(al))}</td>
            </tr>`;
          }))}</tbody>
        </table></div>
      </section>
      ${sale.memo ? html`<section className="panel panel-pad"><h2 className="panel-title">メモ</h2><p className="prewrap">${sale.memo}</p></section>` : null}`;
  }

  const blankSaleItem = () => ({ key: uid('k'), id: '', productId: '', qty: '1', unitPrice: '' });

  function SaleForm({ ctx, params }) {
    const { db, d, nav, commit, notify } = ctx;
    const editing = params.id ? db.sales.find(s => s.id === params.id) : null;
    const [f, setF] = useState(() => (editing
      ? { date: editing.date, channel: editing.channel, customer: editing.customer || '', memo: editing.memo || '', items: editing.items.map(it => ({ key: it.id, id: it.id, productId: it.productId, qty: String(it.qty), unitPrice: String(it.unitPrice) })) }
      : { date: TODAY, channel: OPTIONS.channels[0], customer: '', memo: '', items: [blankSaleItem()] }));
    const [errors, setErrors] = useState([]);
    const errRef = useRef(null);
    useScrollTo(errors, errRef);
    if (params.id && !editing) return html`<${NotFound} ctx=${ctx} to="sales" label="販売" />`;

    const set = (k, v) => setF(p => ({ ...p, [k]: v }));
    const setItem = (key, patch) => setF(p => ({ ...p, items: p.items.map(it => (it.key === key ? { ...it, ...patch } : it)) }));
    const addItem = () => setF(p => ({ ...p, items: [...p.items, blankSaleItem()] }));
    const removeItem = key => setF(p => ({ ...p, items: p.items.length > 1 ? p.items.filter(it => it.key !== key) : [blankSaleItem()] }));
    const onProduct = (key, pid) => { const p = d.products.get(pid); setItem(key, { productId: pid, unitPrice: p ? String(p.price) : '' }); };

    const parsed = f.items.map(it => ({ ...it, qtyN: parseNum(it.qty), priceN: parseNum(it.unitPrice) }));
    const planInput = parsed
      .filter(it => it.productId && Number.isInteger(it.qtyN) && it.qtyN > 0)
      .map(it => ({ key: it.key, id: it.id, productId: it.productId, qty: it.qtyN, unitPrice: Number.isFinite(it.priceN) ? it.priceN : 0 }));
    const plan = planSale(db, planInput, { excludeSaleId: editing ? editing.id : null });
    const pd = plan.d;
    const total = sum(plan.items, it => it.unitPrice * it.qty);
    const estCost = sum(plan.items, it => pd.itemCost(it));
    const stockRows = [...plan.need.entries()].map(([cid, need]) => ({ cid, need, avail: pd.coffeeRemain(cid), short: plan.short.get(cid) || 0, name: (pd.coffees.get(cid) || {}).name || '' }));
    const usedPids = new Set(editing ? editing.items.map(it => it.productId) : []);
    const groups = db.coffees
      .map(c => ({ c, ps: pd.productsOf(c.id).filter(p => p.active || usedPids.has(p.id)) }))
      .filter(gr => gr.ps.length && (gr.c.active || gr.ps.some(p => usedPids.has(p.id))));
    const cancel = () => (editing ? nav('sale', { id: editing.id }) : nav('sales'));

    const save = () => {
      const errs = [];
      if (isBlank(f.date)) errs.push('販売日を入力してください。');
      if (!parsed.some(it => it.productId)) errs.push('商品を 1 つ以上選んでください。');
      parsed.forEach((it, i) => {
        const row = `${i + 1}行目`;
        if (!it.productId) { if (parsed.length > 1) errs.push(`${row}：商品を選んでください（使わない行は × で消せます）。`); return; }
        if (!(Number.isInteger(it.qtyN) && it.qtyN > 0)) errs.push(`${row}：数量は 1 以上の整数で入力してください。`);
        if (!(Number.isFinite(it.priceN) && it.priceN >= 0)) errs.push(`${row}：単価（税抜）を円で入力してください。`);
      });
      for (const s of stockRows) if (s.short > 0) errs.push(`${s.name} の在庫が ${fmtG(s.short)} 足りません（在庫 ${fmtG(s.avail)}、必要 ${fmtG(s.need)}）。先に焙煎記録か在庫調整を入れてください。`);
      setErrors(errs);
      if (errs.length) return;
      const id = editing ? editing.id : uid('s');
      const rec = { id, date: f.date, channel: f.channel, customer: f.customer.trim(), memo: f.memo.trim(), items: plan.items.map(it => ({ id: it.id || uid('i'), productId: it.productId, qty: it.qty, unitPrice: it.unitPrice, allocs: it.allocs })) };
      commit(n => { if (editing) n.sales = n.sales.map(x => (x.id === id ? rec : x)); else n.sales.push(rec); });
      notify(editing ? '販売を保存しました。引当をやり直しました' : `販売を記録しました（${yen(total)}）。在庫から古い順に出しました`);
      nav('sale', { id });
    };

    return html`
      <${PageHead} back=${{ label: editing ? 'この販売' : '販売', go: cancel }} eyebrow="販売" title=${editing ? '販売を編集' : '販売を記録'} />
      <div className="form form-narrow">
        <${ErrorList} errors=${errors} innerRef=${errRef} />
        <section className="form-section">
          <h2 className="panel-title">販売</h2>
          <div className="grid">
            <${Field} label="販売日" req htmlFor="sale-date"><input id="sale-date" className="input" type="date" value=${f.date} onChange=${e => set('date', e.target.value)} /></${Field}>
            <${Field} label="販売チャネル" req htmlFor="sale-channel"><select id="sale-channel" className="select" value=${f.channel} onChange=${e => set('channel', e.target.value)}>${OPTIONS.channels.map(o => html`<option key=${o} value=${o}>${o}</option>`)}</select></${Field}>
            <${Field} label="販売先" htmlFor="sale-customer" hint="卸先の店名、イベント名など"><input id="sale-customer" className="input" autoComplete="off" value=${f.customer} onChange=${e => set('customer', e.target.value)} /></${Field}>
            <${Field} label="メモ" htmlFor="sale-memo"><input id="sale-memo" className="input" autoComplete="off" value=${f.memo} onChange=${e => set('memo', e.target.value)} /></${Field}>
          </div>
        </section>
        <section className="form-section">
          <div className="form-section-head"><h2 className="panel-title">明細</h2><span className="muted small">単価の初期値は商品の販売価格（税抜）。卸や値引きのときは書き換えます</span></div>
          <div className="items">${f.items.map((it, i) => {
            const amt = parseNum(it.qty) * parseNum(it.unitPrice);
            return html`<div className="item" key=${it.key}>
              <div className="field item-product">
                <label className="field-label" htmlFor=${`sale-item-${i}-product`}>商品</label>
                <select id=${`sale-item-${i}-product`} className="select" value=${it.productId} onChange=${e => onProduct(it.key, e.target.value)}>
                  <option value="">選んでください</option>
                  ${groups.map(gr => html`<optgroup key=${gr.c.id} label=${`${gr.c.name}（在庫 ${fmtG(pd.coffeeRemain(gr.c.id))}）`}>${gr.ps.map(p => html`<option key=${p.id} value=${p.id}>${gr.c.name} ${p.sizeG}g・${yen(p.price)}</option>`)}</optgroup>`)}
                </select>
              </div>
              <div className="field item-qty"><label className="field-label" htmlFor=${`sale-item-${i}-qty`}>数量</label><${UnitInput} unit="個" inputMode="numeric" id=${`sale-item-${i}-qty`} value=${it.qty} onChange=${e => setItem(it.key, { qty: e.target.value })} /></div>
              <div className="field item-price"><label className="field-label" htmlFor=${`sale-item-${i}-price`}>単価（税抜）</label><${UnitInput} unit="円" inputMode="numeric" id=${`sale-item-${i}-price`} value=${it.unitPrice} onChange=${e => setItem(it.key, { unitPrice: e.target.value })} /></div>
              <div className="item-amount"><span className="only-narrow muted">金額</span><span>${Number.isFinite(amt) ? yen(amt) : '—'}</span></div>
              <button type="button" className="icon-btn item-del" aria-label=${`${i + 1}行目を削除`} onClick=${() => removeItem(it.key)}>×</button>
            </div>`;
          })}</div>
          <div><button type="button" className="btn" onClick=${addItem}>＋ 明細を追加</button></div>
          <div className="calc">
            <div className="calc-item"><span>金額（税抜）</span><strong>${yen(total)}</strong></div>
            <div className="calc-item"><span>原価（見込み）</span><strong>${yen(estCost)}</strong></div>
            <div className="calc-item"><span>粗利（見込み）</span><strong>${yen(total - estCost)}</strong></div>
            <div className="calc-item"><span>粗利率</span><strong>${total > 0 ? pct((total - estCost) / total) : '—'}</strong></div>
          </div>
        </section>
        <section className="form-section">
          <div className="form-section-head"><h2 className="panel-title">在庫のチェックと引当の予定</h2><span className="muted small">焙煎日の古い順に出します</span></div>
          ${stockRows.length === 0 ? html`<p className="muted">商品を選ぶと、在庫が足りるか確認します。</p>` : html`<ul className="stock-checks">${stockRows.map(s => html`<li key=${s.cid} className=${cx('stock-check', s.short > 0 && 'is-short')}>
            <span className="stock-check-name">${s.name}</span>
            <span>必要 ${fmtG(s.need)} ／ 在庫 ${fmtG(s.avail)}</span>
            <span className=${cx('status', s.short > 0 ? 'status-bad' : 'status-ok')}>${s.short > 0 ? `！ ${fmtG(s.short)} 足りません` : `✓ 販売後の残り ${fmtG(s.avail - s.need)}`}</span>
          </li>`)}</ul>`}
          ${plan.items.some(it => it.allocs.length) ? html`<div className="table-wrap"><table className="data compact">
            <thead><tr><th>商品</th><th>出す焙煎記録</th><th className="r">重さ</th></tr></thead>
            <tbody>${plan.items.flatMap(it => it.allocs.map((al, j) => { const r = pd.roasts.get(al.roastId); return html`<tr key=${`${it.key}-${j}`}><td>${pd.productLabel(pd.products.get(it.productId))}×${it.qty}</td><td className="nw">${r ? `${fmtDate(r.at.slice(0, 10))} 焙煎` : '—'}</td><td className="r">${fmtG(al.g)}</td></tr>`; }))}</tbody>
          </table></div>` : null}
        </section>
        <div className="form-actions">
          <button type="button" className="btn" onClick=${cancel}>キャンセル</button>
          <button type="button" className="btn btn-primary" onClick=${save}>${editing ? '保存する' : '記録する'}</button>
        </div>
      </div>`;
  }

  /* ---------- 在庫調整 ---------- */
  function initAdjust(db, d, preset) {
    const base = { date: TODAY, kind: 'roast', coffeeId: '', roastId: '', lotId: '', mode: 'delta', delta: '', actual: '', reason: OPTIONS.reasons[0], memo: '' };
    const firstLot = db.lots.filter(l => d.lotRemain(l) > 0).sort((a, b) => a.date.localeCompare(b.date))[0];
    if (preset && preset.kind === 'lot') return { ...base, kind: 'lot', lotId: preset.targetId };
    if (preset && preset.kind === 'roast') { const r = d.roasts.get(preset.targetId); return { ...base, coffeeId: r ? r.coffeeId : '', roastId: preset.targetId, lotId: firstLot ? firstLot.id : '' }; }
    const c = db.coffees.find(x => x.active && d.oldestStock(x.id));
    const r = c ? d.oldestStock(c.id) : null;
    return { ...base, coffeeId: c ? c.id : '', roastId: r ? r.id : '', lotId: firstLot ? firstLot.id : '' };
  }

  function RecentAdjustments({ ctx }) {
    const { db, d, nav, commit, notify } = ctx;
    const rows = [...db.adjustments].sort((a, b) => b.date.localeCompare(a.date));
    const remove = a => {
      const t = a.kind === 'lot' ? d.lots.get(a.targetId) : d.roasts.get(a.targetId);
      const rem = t ? (a.kind === 'lot' ? d.lotRemain(t) : d.roastRemain(t)) : 0;
      if (rem - a.deltaG < 0) { notify('この調整を消すと残量がマイナスになるため、削除できません'); return; }
      commit(n => { n.adjustments = n.adjustments.filter(x => x.id !== a.id); });
      notify('在庫調整を削除しました');
    };
    return html`<section className="panel">
      <div className="panel-head"><h2 className="panel-title">これまでの在庫調整</h2><span className="muted">${rows.length}件</span></div>
      ${rows.length === 0 ? html`<p className="empty">在庫調整はまだありません。</p>` : html`<div className="table-wrap"><table className="data">
        <thead><tr><th>日付</th><th>対象</th><th className="r">増減</th><th>理由</th><th>メモ</th><th></th></tr></thead>
        <tbody>${rows.map(a => html`<tr key=${a.id}>
          <td className="nw">${fmtDate(a.date)}</td>
          <td><button type="button" className="cell-link" onClick=${() => nav(a.kind === 'lot' ? 'lot' : 'roast', { id: a.targetId })}>${adjTargetLabel(d, a)}</button></td>
          <td className="r">${signedG(a.deltaG)}</td><td className="nw">${a.reason}</td><td>${a.memo}</td>
          <td className="r"><${ConfirmButton} className="btn btn-quiet btn-small btn-danger" label="削除" confirmLabel="もう一度押す" onConfirm=${() => remove(a)} /></td>
        </tr>`)}</tbody>
      </table></div>`}
    </section>`;
  }

  function AdjustScreen({ ctx, params }) {
    const { db, d, nav, commit, notify } = ctx;
    const [f, setF] = useState(() => initAdjust(db, d, params.preset));
    const [errors, setErrors] = useState([]);
    const errRef = useRef(null);
    useScrollTo(errors, errRef);
    const set = (k, v) => setF(p => ({ ...p, [k]: v }));
    const onCoffee = cid => { const r = d.oldestStock(cid) || d.roastsOf(cid)[0]; setF(p => ({ ...p, coffeeId: cid, roastId: r ? r.id : '' })); };
    const onMode = v => setF(p => ({ ...p, mode: v, reason: v === 'count' ? '棚卸しの差' : p.reason }));
    const roastCoffees = db.coffees.filter(c => db.roasts.some(r => r.coffeeId === c.id));
    const roastOptions = f.coffeeId ? d.roastsOf(f.coffeeId).filter(r => d.roastRemain(r) > 0 || r.id === f.roastId) : [];
    const lotOptions = [...db.lots].filter(l => d.lotRemain(l) > 0 || l.id === f.lotId).sort((a, b) => b.date.localeCompare(a.date));
    const target = f.kind === 'lot' ? d.lots.get(f.lotId) : d.roasts.get(f.roastId);
    const current = target ? (f.kind === 'lot' ? d.lotRemain(target) : d.roastRemain(target)) : NaN;
    const delta = f.mode === 'count' ? parseNum(f.actual) - current : parseNum(f.delta);
    const after = current + delta;

    const save = () => {
      const errs = [];
      if (isBlank(f.date)) errs.push('日付を入力してください。');
      if (!target) errs.push(f.kind === 'lot' ? '生豆ロットを選んでください。' : '銘柄と焙煎記録を選んでください。');
      if (f.mode === 'count') {
        const a = parseNum(f.actual);
        if (!(Number.isInteger(a) && a >= 0)) errs.push('実際に量った残量を、0 以上の整数（g）で入力してください。');
        else if (target && a === current) errs.push('実際の残量が今の残量と同じなので、調整はいりません。');
      } else if (!(Number.isInteger(delta) && delta !== 0)) {
        errs.push('増減量を g の整数で入力してください（減ったときはマイナス。例：-50）。');
      }
      if (target && Number.isFinite(after) && after < 0) errs.push(`調整後の残量がマイナスになります（今の残量は ${fmtG(current)}）。`);
      setErrors(errs);
      if (errs.length) return;
      commit(n => { n.adjustments.push({ id: uid('a'), date: f.date, kind: f.kind, targetId: target.id, deltaG: delta, reason: f.reason, memo: f.memo.trim() }); });
      notify(`在庫を調整しました（${signedG(delta)}）`);
      nav(f.kind === 'lot' ? 'lot' : 'roast', { id: target.id });
    };

    return html`
      <${PageHead} title="在庫調整" eyebrow="記録する" />
      <p className="lead">販売以外で在庫が増えたり減ったりしたときに記録します（試飲・サンプル・廃棄・棚卸しの差など）。</p>
      <div className="form form-narrow">
        <${ErrorList} errors=${errors} innerRef=${errRef} />
        <section className="form-section">
          <h2 className="panel-title">対象</h2>
          <${Seg} label="対象の種類" value=${f.kind} onChange=${v => set('kind', v)} options=${[['roast', '焙煎豆'], ['lot', '生豆']]} />
          ${f.kind === 'roast' ? html`<div className="grid">
            <${Field} label="銘柄" req htmlFor="adj-coffee">
              <select id="adj-coffee" className="select" value=${f.coffeeId} onChange=${e => onCoffee(e.target.value)}>
                <option value="">選んでください</option>
                ${roastCoffees.map(c => html`<option key=${c.id} value=${c.id}>${c.name}（残り ${fmtG(d.coffeeRemain(c.id))}）</option>`)}
              </select>
            </${Field}>
            <${Field} label="焙煎記録" req htmlFor="adj-roast" hint="残量のある焙煎記録を、古い順に並べています">
              <select id="adj-roast" className="select" value=${f.roastId} onChange=${e => set('roastId', e.target.value)}>
                <option value="">選んでください</option>
                ${roastOptions.map(r => html`<option key=${r.id} value=${r.id}>${fmtDate(r.at.slice(0, 10))} 焙煎（残り ${fmtG(d.roastRemain(r))}）</option>`)}
              </select>
            </${Field}>
          </div>` : html`<${Field} label="生豆ロット" req htmlFor="adj-lot">
            <select id="adj-lot" className="select" value=${f.lotId} onChange=${e => set('lotId', e.target.value)}>
              <option value="">選んでください</option>
              ${lotOptions.map(l => html`<option key=${l.id} value=${l.id}>${l.name}（残り ${fmtKg(d.lotRemain(l))}）</option>`)}
            </select>
          </${Field}>`}
        </section>
        <section className="form-section">
          <h2 className="panel-title">増減</h2>
          <${Seg} label="入力のしかた" value=${f.mode} onChange=${onMode} options=${[['delta', '増減量を入力'], ['count', '棚卸し（量った残量を入力）']]} />
          <div className="grid">
            ${f.mode === 'delta'
              ? html`<${Field} label="増減量" req htmlFor="adj-delta" hint="減ったときはマイナス（例：-50）"><${UnitInput} unit="g" inputMode="text" id="adj-delta" value=${f.delta} onChange=${e => set('delta', e.target.value)} /></${Field}>`
              : html`<${Field} label="実際に量った残量" req htmlFor="adj-actual" hint="差を自動で計算します"><${UnitInput} unit="g" inputMode="numeric" id="adj-actual" value=${f.actual} onChange=${e => set('actual', e.target.value)} /></${Field}>`}
            <${Field} label="日付" req htmlFor="adj-date"><input id="adj-date" className="input" type="date" value=${f.date} onChange=${e => set('date', e.target.value)} /></${Field}>
            <${Field} label="理由" req htmlFor="adj-reason"><select id="adj-reason" className="select" value=${f.reason} onChange=${e => set('reason', e.target.value)}>${OPTIONS.reasons.map(o => html`<option key=${o} value=${o}>${o}</option>`)}</select></${Field}>
            <${Field} label="メモ" htmlFor="adj-memo"><input id="adj-memo" className="input" autoComplete="off" value=${f.memo} onChange=${e => set('memo', e.target.value)} /></${Field}>
          </div>
          <div className="calc">
            <div className="calc-item"><span>今の残量</span><strong>${fmtG(current)}</strong></div>
            <div className="calc-item"><span>増減</span><strong>${Number.isFinite(delta) ? signedG(delta) : '—'}</strong></div>
            <div className="calc-item"><span>調整後の残量</span><strong className=${after < 0 ? 'is-bad' : ''}>${Number.isFinite(after) ? fmtG(after) : '—'}</strong></div>
          </div>
        </section>
        <div className="form-actions"><button type="button" className="btn btn-primary" onClick=${save}>記録する</button></div>
      </div>
      <${RecentAdjustments} ctx=${ctx} />`;
  }

  /* ---------- 集計 ---------- */
  function MonthChart({ rows }) {
    const [hover, setHover] = useState(null);
    const max = Math.max(1, ...rows.map(r => r.amount));
    const H = 150;
    const compact = rows.length > 6;
    return html`<div className="colchart" role="group" aria-label="月別の売上（税抜）">
      ${rows.map((r, i) => {
        const h = Math.max(2, Math.round((r.amount / max) * H));
        return html`<div key=${r.ym} className=${cx('col', hover === i && 'is-hover')} tabIndex="0" aria-label=${`${monthLabel(r.ym)}：売上 ${yen(r.amount)}、粗利 ${yen(r.margin)}`} onMouseEnter=${() => setHover(i)} onMouseLeave=${() => setHover(null)} onFocus=${() => setHover(i)} onBlur=${() => setHover(null)}>
          <div className="col-plot" style=${{ height: `${H + 24}px` }}>
            ${hover === i ? html`<div className="tip"><strong>${monthLabel(r.ym)}</strong><span>売上 ${yen(r.amount)}</span><span>粗利 ${yen(r.margin)}（${pct(r.margin / r.amount)}）</span><span>${r.count}件・${fmtKg(r.grams)}</span></div>` : null}
            <div className="col-val">${compact ? yenMan(r.amount) : yen(r.amount)}</div>
            <div className="col-bar" style=${{ height: `${h}px` }}></div>
          </div>
          <div className="col-label">${Number(r.ym.slice(5))}月</div>
        </div>`;
      })}
    </div>`;
  }

  function Reports({ ctx }) {
    const { db, d } = ctx;
    const [period, setPeriod] = useState('3m');
    const byMonth = new Map();
    for (const s of db.sales) {
      const ym = s.date.slice(0, 7);
      const m = byMonth.get(ym) || { ym, amount: 0, cost: 0, grams: 0, count: 0 };
      m.amount += d.saleAmount(s); m.cost += d.saleCost(s); m.grams += d.saleGrams(s); m.count += 1;
      byMonth.set(ym, m);
    }
    const months = [...byMonth.values()].sort((a, b) => a.ym.localeCompare(b.ym)).map(m => ({ ...m, margin: m.amount - m.cost }));
    const tot = { amount: sum(months, m => m.amount), cost: sum(months, m => m.cost), grams: sum(months, m => m.grams), count: sum(months, m => m.count) };
    const thisYm = TODAY.slice(0, 7);
    const inPeriod = ym => (period === 'all' ? true : period === 'this' ? ym === thisYm : period === 'last' ? ym === addMonths(thisYm, -1) : ym >= addMonths(thisYm, -2) && ym <= thisYm);
    const byCoffee = new Map();
    for (const s of db.sales) {
      if (!inPeriod(s.date.slice(0, 7))) continue;
      for (const it of s.items) {
        const p = d.products.get(it.productId);
        if (!p) continue;
        const row = byCoffee.get(p.coffeeId) || { cid: p.coffeeId, grams: 0, amount: 0, cost: 0 };
        row.grams += p.sizeG * it.qty; row.amount += d.itemAmount(it); row.cost += d.itemCost(it);
        byCoffee.set(p.coffeeId, row);
      }
    }
    const coffeeRows = [...byCoffee.values()].sort((a, b) => b.amount - a.amount);
    const ct = { grams: sum(coffeeRows, r => r.grams), amount: sum(coffeeRows, r => r.amount), cost: sum(coffeeRows, r => r.cost) };
    return html`
      <${PageHead} title="集計" eyebrow="見る" />
      <section className="panel panel-pad">
        <div className="section-head"><h2 className="panel-title">月別の売上</h2><span className="muted small">税抜・棒にカーソルを合わせると粗利も出ます</span></div>
        ${months.length ? html`<${MonthChart} rows=${months.slice(-12)} />` : html`<p className="muted">まだ販売の記録がありません。</p>`}
      </section>
      <section className="panel">
        <div className="panel-head"><h2 className="panel-title">月別</h2><span className="muted small">税抜</span></div>
        <div className="table-wrap"><table className="data">
          <thead><tr><th>月</th><th className="r">売上</th><th className="r">原価</th><th className="r">粗利</th><th className="r">粗利率</th><th className="r">販売した重さ</th><th className="r">件数</th></tr></thead>
          <tbody>${[...months].reverse().map(m => html`<tr key=${m.ym}><td className="nw">${monthLabel(m.ym)}</td><td className="r">${yen(m.amount)}</td><td className="r">${yen(m.cost)}</td><td className="r">${yen(m.margin)}</td><td className="r">${pct(m.margin / m.amount)}</td><td className="r">${fmtKg(m.grams)}</td><td className="r">${m.count}</td></tr>`)}</tbody>
          <tfoot><tr><td>合計</td><td className="r">${yen(tot.amount)}</td><td className="r">${yen(tot.cost)}</td><td className="r">${yen(tot.amount - tot.cost)}</td><td className="r">${pct((tot.amount - tot.cost) / tot.amount)}</td><td className="r">${fmtKg(tot.grams)}</td><td className="r">${tot.count}</td></tr></tfoot>
        </table></div>
      </section>
      <section className="panel">
        <div className="panel-head panel-head-wrap"><h2 className="panel-title">銘柄別</h2><${Seg} label="期間" value=${period} onChange=${setPeriod} options=${[['this', '今月'], ['last', '先月'], ['3m', '過去3か月'], ['all', 'すべて']]} /></div>
        ${coffeeRows.length === 0 ? html`<p className="empty">この期間の販売はありません。</p>` : html`<div className="table-wrap"><table className="data">
          <thead><tr><th>銘柄</th><th className="r">販売した重さ</th><th className="r">売上</th><th className="r">粗利</th><th className="r">粗利率</th></tr></thead>
          <tbody>${coffeeRows.map(r => html`<tr key=${r.cid}><td>${(d.coffees.get(r.cid) || {}).name || '—'}</td><td className="r">${fmtG(r.grams)}</td><td className="r">${yen(r.amount)}</td><td className="r">${yen(r.amount - r.cost)}</td><td className="r">${pct((r.amount - r.cost) / r.amount)}</td></tr>`)}</tbody>
          <tfoot><tr><td>合計</td><td className="r">${fmtG(ct.grams)}</td><td className="r">${yen(ct.amount)}</td><td className="r">${yen(ct.amount - ct.cost)}</td><td className="r">${pct((ct.amount - ct.cost) / ct.amount)}</td></tr></tfoot>
        </table></div>`}
      </section>`;
  }

  /* ---------- その他（スマホ用メニュー） ---------- */
  function MenuScreen({ ctx }) {
    const items = [['coffees', '銘柄・商品', '銘柄ごとの残量、内容量と価格'], ['adjust', '在庫調整', '試飲・サンプル・廃棄・棚卸しの差'], ['reports', '集計', '月別・銘柄別の売上と粗利'], ['saleForm', '販売を記録', '商品と数量を入れて、在庫から出す']];
    return html`
      <${PageHead} title="その他" />
      <div className="panel"><ul className="rows">${items.map(([name, label, desc]) => html`<li key=${name}><button type="button" className="row" onClick=${() => ctx.nav(name)}>
        <div className="row-main"><div className="row-title">${label}</div><div className="row-meta">${desc}</div></div>
        <div className="row-side muted" aria-hidden="true">›</div>
      </button></li>`)}</ul></div>
      <${DemoNotice} ctx=${ctx} />`;
  }

  const SCREENS = { home: Home, lots: LotList, lot: LotDetail, lotForm: LotForm, roasts: RoastList, roast: RoastDetail, roastForm: RoastForm, coffees: CoffeeList, sales: SaleList, sale: SaleDetail, saleForm: SaleForm, adjust: AdjustScreen, reports: Reports, menu: MenuScreen };

  class Boundary extends React.Component {
    constructor(props) { super(props); this.state = { err: null }; }
    static getDerivedStateFromError(err) { return { err }; }
    componentDidCatch(err) { console.error(err); }
    render() {
      if (!this.state.err) return this.props.children;
      return html`<div className="panel panel-pad" role="alert">
        <h2 className="panel-title">この画面を表示できませんでした</h2>
        <p className="muted">${String(this.state.err && this.state.err.message || this.state.err)}</p>
        <div><button type="button" className="btn" onClick=${this.props.onHome}>ホームに戻る</button></div>
      </div>`;
    }
  }

  function App() {
    const [db, setDb] = useState(buildSeed);
    const [route, setRoute] = useState({ name: 'home' });
    const [toast, setToast] = useState(null);
    const timer = useRef(null);
    const d = useMemo(() => derive(db), [db]);
    const notify = msg => { setToast(msg); clearTimeout(timer.current); timer.current = setTimeout(() => setToast(null), 3600); };
    const nav = (name, extra = {}) => { setRoute({ name, ...extra }); window.scrollTo(0, 0); };
    const commit = fn => setDb(prev => { const next = JSON.parse(JSON.stringify(prev)); fn(next); return next; });
    const reset = () => { setDb(buildSeed()); setRoute({ name: 'home' }); window.scrollTo(0, 0); notify('サンプルデータに戻しました'); };
    const ctx = { db, d, route, nav, commit, notify, reset };
    const Screen = SCREENS[route.name] || Home;
    const routeKey = JSON.stringify(route);
    return html`<div className="shell">
      <${Sidebar} ctx=${ctx} />
      <div className="main-col">
        <${TopBar} ctx=${ctx} />
        <main className="main">
          <div className="main-inner">
            <${Boundary} key=${routeKey} onHome=${() => nav('home')}>
              <${Screen} ctx=${ctx} params=${route} />
            </${Boundary}>
          </div>
        </main>
      </div>
      <${TabBar} ctx=${ctx} />
      ${toast ? html`<div className="toast" role="status" aria-live="polite">${toast}</div>` : null}
    </div>`;
  }

  ReactDOM.createRoot(rootEl).render(html`<${App} />`);
})();
</script>
</body>
</html>
