# 豆帳：Fly.io の設定（architecture.md「7」）
# app の名前は、`fly launch --no-deploy` で作ったものに書き換える
app = "mamecho"
primary_region = "nrt"  # 東京

[build]

[deploy]
  # 新しいマシンに切り替わる前に、DB の構造変更（マイグレーション）を実行する
  release_command = "python manage.py migrate --noinput"

[env]
  DJANGO_ALLOWED_HOSTS = "mamecho.fly.dev"
  DJANGO_CSRF_TRUSTED_ORIGINS = "https://mamecho.fly.dev"
  # DJANGO_SECRET_KEY・DATABASE_URL・DJANGO_ADMIN_PATH は `fly secrets set` で入れる

[http_service]
  internal_port = 8000
  force_https = true
  # 焙煎の直後にすぐ開けるよう、マシンを止めない
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
